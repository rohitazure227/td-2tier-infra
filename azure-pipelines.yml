trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'sc-td2tier-terraform'

stages:

- stage: Plan
  displayName: 'Terraform Plan'

  jobs:

  - job: TerraformPlan
    displayName: 'Terraform Init, Validate and Plan'

    steps:

    # Install the same Terraform version used locally
    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '1.16.2'

    # Login to Azure using the Azure DevOps service connection
    - task: AzureCLI@2
      displayName: 'Terraform Init, Validate and Plan'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Creating temporary SSH public key file..."

          echo "$(ssh_public_key)" > "$(Agent.TempDirectory)/id_rsa.pub"

          export TF_VAR_environment="$(environment)"
          export TF_VAR_location="$(location)"
          export TF_VAR_vm_count="$(vm_count)"
          export TF_VAR_vm_size="$(vm_size)"
          export TF_VAR_ssh_public_key_path="$(Agent.TempDirectory)/id_rsa.pub"
          export TF_VAR_sql_admin_login="$(sql_admin_login)"
          export TF_VAR_sql_admin_object_id="$(sql_admin_object_id)"

          terraform init -input=false

          terraform validate

          terraform plan -input=false -out=tfplan

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: 'tfplan'
        artifact: 'terraform-plan'

  # Apply the approved Terraform plan
- stage: Apply
  displayName: 'Terraform Apply'
  dependsOn: Plan
  condition: succeeded()

  jobs:

  - deployment: TerraformApply
    displayName: 'Terraform Apply'
    environment: 'td-2tier-dev'

    strategy:
      runOnce:
        deploy:

          steps:

          - checkout: self

          # Download the exact Terraform plan created by the Plan stage
          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Plan'
            inputs:
              buildType: 'current'
              artifactName: 'terraform-plan'
              targetPath: '$(Pipeline.Workspace)/terraform-plan'

          # Install the same Terraform version used locally
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '1.16.2'

          # Login to Azure and apply the approved plan
          - task: AzureCLI@2
            displayName: 'Terraform Apply'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |

                echo "Creating temporary SSH public key file..."

                echo "$(ssh_public_key)" > "$(Agent.TempDirectory)/id_rsa.pub"

                export TF_VAR_environment="$(environment)"
                export TF_VAR_location="$(location)"
                export TF_VAR_vm_count="$(vm_count)"
                export TF_VAR_vm_size="$(vm_size)"
                export TF_VAR_ssh_public_key_path="$(Agent.TempDirectory)/id_rsa.pub"
                export TF_VAR_sql_admin_login="$(sql_admin_login)"
                export TF_VAR_sql_admin_object_id="$(sql_admin_object_id)"

                echo "Initializing Terraform..."

                terraform init -input=false

                echo "Applying the approved Terraform plan..."

                terraform apply -input=false "$(Pipeline.Workspace)/terraform-plan/tfplan"